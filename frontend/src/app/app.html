   Calculadora <span class="font-semibold text-emerald-900">IMC</span>
    </h1>

    <div class="space-y-4">
      <input 
        type="number" 
        [(ngModel)]="comprimento" 
        placeholder="Metros Para Km (km)"
        class="w-full px-6 py-4 bg-slate-50 border-transparent rounded-2xl outline-none focus:ring-2 focus:ring-emerald-100 focus:bg-white transition-all text-slate-700 placeholder:text-slate-300"
      >
      
      <input 
        type="number" 
        [(ngModel)]="altura" 
        placeholder="altura (mi)"
        class="w-full px-6 py-4 bg-slate-50 border-transparent rounded-2xl outline-none focus:ring-2 focus:ring-emerald-100 focus:bg-white transition-all text-slate-700 placeholder:text-slate-300"
      >

      <button (click)="calcular()" class="w-full bg-slate-900 hover:bg-emerald-950 text-emerald-50 font-medium py-5 rounded-2xl transition-all duration-300 shadow-lg shadow-slate-200 active:scale-[0.98] mt-2">
        Calcular IMC
      </button>
    </div>

    <div *ngIf="resultado" class="mt-8 pt-8 border-t border-slate-50 flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-700">
      <h3 class="text-[10px] font-bold tracking-[0.2em] text-emerald-600/60 uppercase mb-4">
        Diagnóstico
      </h3>
      
      <p class="text-4xl font-light text-slate-800 mb-2">
        <span class="text-sm text-slate-400 block text-center mb-1 font-normal uppercase tracking-widest">Seu IMC</span>
        {{resultado.imc}}
      </p>
      
      <p class="px-6 py-2 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold tracking-wide border border-emerald-100">
        {{resultado.resultado}}
      </p>
